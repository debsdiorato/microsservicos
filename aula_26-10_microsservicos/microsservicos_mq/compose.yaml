services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  pedidos-api:
    build: ./pedidos_api
    ports:
      - "8000:8000"
    environment:
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  notificacoes-worker:
    build: ./notificacoes_worker
    environment:
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      TEMPO_PROCESSAMENTO: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  estoque-worker:
    build: ./estoque_worker
    environment:
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      TEMPO_PROCESSAMENTO: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
